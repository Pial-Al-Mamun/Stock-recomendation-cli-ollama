services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    stdin_open: true
    tty: true

volumes:
  ollama: {}
